stages:
  - compile
  - package

variables:
  DEFAULT_IMAGE_NAME: node:20-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

compile-job:
  stage: compile
  image: $DEFAULT_IMAGE_NAME
  before_script:
    - npm ci --include=optional || (rm -rf node_modules package-lock.json && npm install)
  script:
    - npm install --no-save @rollup/rollup-linux-x64-musl
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

package-job:
  stage: package
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  needs:
    - compile-job
  before_script:
    - apk update && apk add --no-cache docker
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_TAG'